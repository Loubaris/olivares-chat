<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivares Studio</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --side: #efede8; --text: #1d1c1a; --muted: #6f6c66;
    --line: #e4e1db; --accent: #c2643c; --accent-text: #fff; --bubble: #ebe7df; --bad: #b3402e; --good: #2f7d4f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161514; --panel: #1d1c1a; --side: #121110; --text: #edeae4; --muted: #9a968e;
      --line: #2f2d29; --accent: #e08a5f; --accent-text: #1a1210; --bubble: #2a2825; --bad: #e0705d; --good: #5cb882;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* login */
  #login { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  #login h1 { font-size: 24px; margin: 0 0 6px; }
  #login p { color: var(--muted); margin: 0 0 20px; }
  .field { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  .primary { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .err { color: var(--bad); margin-top: 10px; font-size: 14px; }

  /* app */
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 16px 16px 8px; font-weight: 700; }
  #newChat { margin: 0 12px 10px; padding: 9px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--text); text-align: left; }
  #convs { flex: 1; overflow-y: auto; padding: 0 8px; }
  .conv { display: flex; align-items: center; border-radius: 8px; }
  .conv button.open { flex: 1; text-align: left; background: none; border: 0; color: var(--text); padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv.active { background: var(--bubble); }
  .conv button.del { background: none; border: 0; color: var(--muted); padding: 4px 8px; visibility: hidden; }
  .conv:hover button.del { visibility: visible; }
  .balance { border-top: 1px solid var(--line); padding: 12px 16px; font-size: 13px; color: var(--muted); }
  .balance b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .bar div { height: 100%; background: var(--accent); }
  .who { display: flex; justify-content: space-between; margin-top: 6px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #topbar { display: none; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: center; gap: 10px; }
  #thread { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .inner { max-width: 780px; margin: 0 auto; }
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty h2 { color: var(--text); font-size: 22px; margin-bottom: 6px; }
  .msg { margin-bottom: 22px; }
  .msg.user .body { background: var(--bubble); border-radius: 14px; padding: 10px 14px; margin-left: auto; max-width: 85%; width: fit-content; white-space: pre-wrap; }
  .msg.assistant .body { overflow-wrap: anywhere; }
  .body p { margin: 0 0 10px; }
  .body pre { background: var(--side); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 13px; }
  .body code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .body :not(pre) > code { background: var(--side); padding: 1px 5px; border-radius: 5px; }
  .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .msg.user .files { justify-content: flex-end; }
  .file { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 11px; color: var(--text); font-size: 13px; }
  button.file:hover { border-color: var(--accent); }
  .file small { color: var(--muted); }
  .preview { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; border: 1px solid var(--line); margin-top: 8px; image-rendering: pixelated; background: var(--side); }
  .status { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .3; } to { opacity: 1; } }

  #composer { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .box { max-width: 780px; margin: 0 auto; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 8px; }
  #pending { display: flex; flex-wrap: wrap; gap: 6px; }
  #pending:not(:empty) { margin-bottom: 6px; }
  #input { width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; resize: none; outline: none; padding: 6px 8px; max-height: 200px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  #attach { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 8px; }
  #attach:hover { background: var(--bubble); }
  #send { border: 0; background: var(--accent); color: var(--accent-text); border-radius: 9px; padding: 7px 16px; font-weight: 600; }
  #send:disabled { opacity: .45; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 6px; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 25% 0 0; z-index: 5; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
    aside.open { transform: none; }
    #topbar { display: flex; }
  }
</style>
</head>
<body>

<section id="login">
  <h1>Olivares Studio</h1>
  <p>Enter your access code.</p>
  <input id="code" class="field" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
  <button id="go" class="primary">Sign in</button>
  <div class="err" id="loginErr" hidden></div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand">Olivares Studio</div>
    <button id="newChat">＋ New chat</button>
    <div id="convs"></div>
    <div class="balance">
      Balance
      <b id="bal">–</b>
      <div class="bar"><div id="balBar" style="width:0"></div></div>
      <div class="who"><span id="who"></span><button class="link" id="logout">Sign out</button></div>
    </div>
  </aside>

  <main>
    <div id="topbar"><button class="link" id="menu">☰ Chats</button><span id="topTitle"></span></div>
    <div id="thread"><div class="inner" id="msgs"></div></div>
    <div id="composer">
      <div class="box">
        <div id="pending"></div>
        <textarea id="input" rows="1" placeholder="Ask for a model, a texture, an animation… (Enter to send)"></textarea>
        <div class="row">
          <button id="attach" title="Attach files">📎 Attach</button>
          <button id="send">Send</button>
        </div>
      </div>
      <div class="hint">Attach your pack (.zip), models or textures; generated files appear as downloads.</div>
      <input type="file" id="fileInput" multiple hidden>
    </div>
  </main>
</div>

<script>
const BASE = "https://giigecqlofbkwjgnvvnt.supabase.co/functions/v1";
const KEY = "olivares-studio-code";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => n.toLocaleString("en-GB", { style: "currency", currency: "EUR" });
const size = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";

let code = null, convId = null, busy = false, pending = [];
try { code = localStorage.getItem(KEY); } catch {}

async function api(action, body) {
  const r = await fetch(`${BASE}/chat?action=${action}`, {
    method: "POST", headers: { "content-type": "application/json", "x-code": code }, body: JSON.stringify(body ?? {}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

// Minimal markdown: fenced code, inline code, bold, paragraphs
function md(text) {
  const parts = String(text).split(/```[^\n]*\n?([\s\S]*?)```/g);
  return parts.map((p, i) => i % 2
    ? `<pre><code>${esc(p)}</code></pre>`
    : esc(p).split(/\n{2,}/).filter((s) => s.trim()).map((s) =>
        "<p>" + s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>") + "</p>").join("")
  ).join("");
}

function fileChip(f, downloadable) {
  if (!downloadable) return `<span class="file">📄 ${esc(f.filename)} <small>${size(f.size)}</small></span>`;
  return `<button class="file" data-file="${esc(f.file_id)}" data-name="${esc(f.filename)}">⬇ ${esc(f.filename)} <small>${size(f.size)}</small></button>`;
}

function msgEl(role, text, files = []) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="body"></div><div class="files"></div><div class="imgs"></div>`;
  setText(el, role, text);
  files.forEach((f) => addFile(el, f, role === "assistant"));
  return el;
}
function setText(el, role, text) {
  const body = el.querySelector(".body");
  body.hidden = !text;
  body.innerHTML = role === "user" ? esc(text) : md(text);
}
function addFile(el, f, downloadable) {
  el.querySelector(".files").insertAdjacentHTML("beforeend", fileChip(f, downloadable));
}
async function fetchFile(f) {
  const r = await fetch(`${BASE}/chat?action=download`, {
    method: "POST", headers: { "content-type": "application/json", "x-code": code },
    body: JSON.stringify({ conversation_id: convId, file_id: f.file_id }),
  });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Download failed");
  return r.blob();
}

function scrollDown() { $("thread").scrollTop = $("thread").scrollHeight; }

function emptyState(name) {
  $("msgs").innerHTML = `<div class="empty"><h2>Hi ${esc(name || "")} 👋</h2></div>`;
}

async function loadList() {
  const d = await api("list");
  $("who").textContent = d.name;
  $("convs").innerHTML = d.conversations.map((c) =>
    `<div class="conv ${c.id === convId ? "active" : ""}" data-id="${c.id}">
       <button class="open">${esc(c.title)}</button><button class="del" title="Delete">✕</button></div>`).join("");
  return d;
}

async function openConv(id) {
  convId = id; pending = []; renderPending();
  $("side").classList.remove("open");
  const d = await api("get", { conversation_id: id });
  $("topTitle").textContent = d.title;
  $("msgs").innerHTML = "";
  d.messages.forEach((m) => $("msgs").append(msgEl(m.role, m.text, m.files)));
  scrollDown();
  loadList();
}

async function loadBalance() {
  try {
    const r = await fetch(`${BASE}/credits`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "balance", code }),
    });
    const d = await r.json();
    if (!r.ok) return;
    $("bal").textContent = eur(d.remaining_eur);
    $("balBar").style.width = (d.paid_eur ? Math.max(0, 100 - d.used_eur / d.paid_eur * 100) : 0) + "%";
  } catch {}
}

function renderPending() {
  $("pending").innerHTML = pending.map((f, i) =>
    `<span class="file">📄 ${esc(f.filename)} <small>${f.file_id ? size(f.size) : "uploading…"}</small>
     <button class="link" data-rm="${i}">✕</button></span>`).join("");
  $("send").disabled = busy || pending.some((f) => !f.file_id);
}

async function uploadFiles(list) {
  for (const file of list) {
    const item = { filename: file.name, size: file.size };
    pending.push(item); renderPending();
    try {
      const r = await fetch(`${BASE}/chat?action=upload`, {
        method: "POST",
        headers: { "x-code": code, "x-filename": file.name, ...(convId ? { "x-conversation": convId } : {}) },
        body: file,
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      convId = d.conversation_id;
      Object.assign(item, d.file);
    } catch (e) {
      pending.splice(pending.indexOf(item), 1);
      alertMsg("Upload failed: " + e.message);
    }
    renderPending();
  }
}

function alertMsg(text) {
  const el = msgEl("assistant", "");
  el.querySelector(".body").hidden = false;
  el.querySelector(".body").innerHTML = `<p style="color:var(--bad)">${esc(text)}</p>`;
  $("msgs").append(el); scrollDown();
}

async function send() {
  const text = $("input").value.trim();
  if (busy || (!text && !pending.length) || pending.some((f) => !f.file_id)) return;
  if ($("msgs").querySelector(".empty")) $("msgs").innerHTML = "";
  const files = pending.splice(0); renderPending();
  $("msgs").append(msgEl("user", text, files));
  $("input").value = ""; autoGrow();

  const out = msgEl("assistant", "");
  const status = document.createElement("div");
  status.className = "status"; status.innerHTML = `<span class="dot"></span><span>Thinking…</span>`;
  out.append(status);
  $("msgs").append(out); scrollDown();
  busy = true; renderPending();

  let acc = "";
  try {
    const r = await fetch(`${BASE}/chat?action=send`, {
      method: "POST", headers: { "content-type": "application/json", "x-code": code },
      body: JSON.stringify({ conversation_id: convId, message: text, file_ids: files.map((f) => f.file_id) }),
    });
    if (!r.ok || !r.body) throw new Error((await r.json().catch(() => ({}))).error || `Error ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] ?? "null");
        if (ev === "conversation") convId = data.id;
        else if (ev === "text") { acc += data; setText(out, "assistant", acc); status.querySelector("span:last-child").textContent = "Writing…"; }
        else if (ev === "tool") status.querySelector("span:last-child").textContent = "Running the tools…";
        else if (ev === "file") addFile(out, data, true);
        else if (ev === "error") throw new Error(data);
        scrollDown();
      }
    }
  } catch (e) {
    alertMsg(e.message);
  } finally {
    status.remove();
    busy = false; renderPending();
    loadList(); loadBalance();
  }
}

function autoGrow() { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }

async function signIn() {
  $("loginErr").hidden = true;
  try {
    const d = await loadList();
    try { localStorage.setItem(KEY, code); } catch {}
    $("login").hidden = true; $("app").hidden = false;
    emptyState(d.name);
    loadBalance();
  } catch (e) {
    code = null;
    $("loginErr").textContent = e.message; $("loginErr").hidden = false;
    $("login").hidden = false; $("app").hidden = true;
  }
}

$("go").onclick = () => { code = $("code").value.trim().toUpperCase(); if (code) signIn(); };
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
$("logout").onclick = () => { try { localStorage.removeItem(KEY); } catch {} location.reload(); };
$("newChat").onclick = () => { convId = null; pending = []; renderPending(); emptyState($("who").textContent); loadList(); $("side").classList.remove("open"); $("topTitle").textContent = ""; };
$("menu").onclick = () => $("side").classList.toggle("open");
$("send").onclick = send;
$("input").addEventListener("input", autoGrow);
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("attach").onclick = () => $("fileInput").click();
$("fileInput").onchange = (e) => { uploadFiles([...e.target.files]); e.target.value = ""; };
$("pending").onclick = (e) => { const i = e.target.dataset?.rm; if (i != null) { pending.splice(+i, 1); renderPending(); } };
$("composer").addEventListener("dragover", (e) => e.preventDefault());
$("composer").addEventListener("drop", (e) => { e.preventDefault(); uploadFiles([...e.dataTransfer.files]); });

$("convs").onclick = async (e) => {
  const row = e.target.closest(".conv"); if (!row) return;
  if (e.target.classList.contains("del")) {
    await api("delete", { conversation_id: row.dataset.id });
    if (row.dataset.id === convId) $("newChat").click(); else loadList();
  } else openConv(row.dataset.id);
};
$("msgs").onclick = async (e) => {
  const b = e.target.closest("button[data-file]"); if (!b) return;
  try {
    const url = URL.createObjectURL(await fetchFile({ file_id: b.dataset.file }));
    const a = document.createElement("a"); a.href = url; a.download = b.dataset.name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch (err) { alertMsg(err.message); }
};

if (code) signIn();
</script>
</body>
</html>
